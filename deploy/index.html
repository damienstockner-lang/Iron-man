<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friday Assistant</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- SPLASH / HELMET BOOT SCREEN -->
  <div id="splash">
    <div class="splash-arc">
      <div class="splash-ring ring-1"></div>
      <div class="splash-ring ring-2"></div>
      <div class="splash-ring ring-3"></div>
      <div class="splash-core"></div>
    </div>
    <h1 class="splash-title">FRIDAY</h1>
    <p class="splash-sub">Initializing systems…</p>
    <div class="splash-loader"><span></span></div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">
    <!-- TOP HUD BAR -->
    <header class="hud-top">
      <div class="hud-left">
        <div class="hud-logo">F</div>
        <div class="hud-title">FRIDAY</div>
      </div>
      <div class="hud-center">
        <div class="hud-clock" id="hudClock">--:--:--</div>
        <div class="hud-date" id="hudDate">--</div>
      </div>
      <div class="hud-right">
        <button class="hud-btn helmet-toggle" id="helmetToggle" title="Helmet Mode">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
          HELMET
        </button>
        <button class="hud-btn" id="tvRemoteToggle" title="TV Remote">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
          TV
        </button>
        <button class="hud-btn" id="powerBtn" title="Power">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 3h-2v10h2V3zm4.83 2.57L12 12.99 6.17 5.57 4.93 6.41 12 15.99l7.07-9.58z"/></svg>
        </button>
      </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="main-layout">
      <!-- LEFT SIDEBAR: MODULES -->
      <nav class="sidebar">
        <button class="nav-btn active" data-module="chat">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          Assistant
        </button>
        <button class="nav-btn" data-module="schedule">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
          Schedule
        </button>
        <button class="nav-btn" data-module="steps">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.4-1.6v2.2l3.6 1.3 1-4.4z"/></svg>
          Steps
        </button>
        <button class="nav-btn" data-module="contacts">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0-3h2v2H6zm0 6h2v2H6zm4-6h2v2h-2zm0 3h2v2h-2zm0 6h2v2h-2zm4-6h2v2h-2zm0 3h2v2h-2zm0 6h2v2h-2z"/></svg>
          Contacts
        </button>
        <button class="nav-btn" data-module="social">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          Social
        </button>
        <button class="nav-btn" data-module="search">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          Search
        </button>
        <button class="nav-btn" data-module="design">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
          Design
        </button>
        <button class="nav-btn" data-module="translate">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
          Translate
        </button>
        <button class="nav-btn" data-module="vision">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 6c1.11 0 2-.89 2-2 0-1.11-.89-2-2-2-1.11 0-2 .89-2 2 0 1.11.89 2 2 2zm-6 13c0 .55.45 1 1 1h.72c-.35-.6-.54-1.27-.54-2 0-2.21 1.79-4 4-4 .73 0 1.4.19 2 .54V11c0-.55.45-1 1-1h2c.55 0 1 .45 1 1v.72c.6-.35 1.27-.54 2-.54 2.21 0 4 1.79 4 4s-1.79 4-4 4c-.73 0-1.4-.19-2-.54V23c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-2.72c-.6.35-1.27.54-2 .54-2.21 0-4-1.79-4-4s1.79-4 4-4c.73 0 1.4.19 2 .54V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.72c-.6.35-1.27.54-2 .54-2.21 0-4-1.79-4-4s1.79-4 4-4c.73 0 1.4.19 2 .54V11c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1V7c0-.55.45-1 1-1h.72C8.18 6.19 8.85 6 9.54 6c2.21 0 4 1.79 4 4s-1.79 4-4 4c-.73 0-1.4-.19-2-.54V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.72c-.6.35-1.27.54-2 .54-2.21 0-4-1.79-4-4s1.79-4 4-4c.73 0 1.4.19 2 .54V11c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1V7z"/></svg>
          Vision
        </button>
        <button class="nav-btn" data-module="bookings">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
          Bookings
        </button>
      </nav>

      <!-- CENTER: CONTENT -->
      <main class="content-area" id="contentArea">
        <!-- Modules injected here -->
      </main>
    </div>

    <!-- HELMET MODE OVERLAY -->
    <div id="helmetOverlay" class="helmet-overlay hidden">
      <div class="helmet-hud">
        <div class="helmet-corner tl"></div>
        <div class="helmet-corner tr"></div>
        <div class="helmet-corner bl"></div>
        <div class="helmet-corner br"></div>
        <div class="helmet-ring r1"></div>
        <div class="helmet-ring r2"></div>
        <div class="helmet-ring r3"></div>
        <div class="helmet-center-circle"></div>
        <div class="helmet-target" id="helmetTarget"></div>
        <div class="helmet-info left-info">
          <div class="hud-label">TARGET</div>
          <div class="hud-value" id="helmetTargetName">SCANNING...</div>
        </div>
        <div class="helmet-info right-info">
          <div class="hud-label">DISTANCE</div>
          <div class="hud-value" id="helmetDistance">--</div>
        </div>
        <div class="helmet-bottom">
          <div class="hud-label">SYSTEM STATUS</div>
          <div class="hud-value green">ONLINE</div>
        </div>
      </div>
    </div>

    <!-- TV REMOTE OVERLAY -->
    <div id="tvOverlay" class="tv-overlay hidden">
      <div class="tv-panel">
        <div class="tv-header">
          <div class="tv-led on"></div>
          <span>GOOGLE TV REMOTE</span>
        </div>
        <div class="tv-body">
          <div class="tv-power-row">
            <button class="tv-btn tv-power" id="tvPower">⏻</button>
            <button class="tv-btn" id="tvHome">🏠</button>
            <button class="tv-btn" id="tvBack">↩</button>
          </div>
          <div class="tv-dpad">
            <button class="tv-btn tv-d-up" id="tvUp">▲</button>
            <div class="tv-d-center">
              <button class="tv-btn tv-d-ok" id="tvOk">OK</button>
            </div>
            <button class="tv-btn tv-d-down" id="tvDown">▼</button>
            <button class="tv-btn tv-d-left" id="tvLeft">◀</button>
            <button class="tv-btn tv-d-right" id="tvRight">▶</button>
          </div>
          <div class="tv-extra">
            <button class="tv-btn" id="tvVolUp">🔊+</button>
            <button class="tv-btn" id="tvVolDown">🔊-</button>
            <button class="tv-btn" id="tvMute">🔇</button>
            <button class="tv-btn" id="tvYT">▶ YouTube</button>
            <button class="tv-btn" id="tvSearch">🔍</button>
            <button class="tv-btn" id="tvAssistant">🎙</button>
          </div>
        </div>
      </div>
    </div>

    <!-- VOICE INDICATOR -->
    <div id="voiceIndicator" class="voice-indicator hidden">
      <div class="voice-wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="voice-text">Listening…</div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
